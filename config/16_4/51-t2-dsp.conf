# WirePlumber configuration for T2 MacBook Pro 16,4 DSP
# Uses node.software-dsp module like Asahi Linux to properly hide raw devices

monitor.alsa.rules = [
    # Speakers hardware node
    {
        matches = [
            { api.alsa.card.name = "Apple T2 Audio", alsa.name = "Speaker" }
        ]
        actions = {
            update-props = {
                node.name = "alsa_output.t2_raw_speakers"
                node.description = "Raw Speaker Device (do not use)"
                node.nick = "RawSpeakers"
            }
        }
    }
    # Mic hardware node
    {
        matches = [
            { api.alsa.card.name = "Apple T2 Audio", alsa.name = "Digital Mic" }
        ]
        actions = {
            update-props = {
                node.name = "alsa_input.t2_raw_mic"
                node.description = "Raw Mic Device (do not use)"
                node.nick = "RawMic"
            }
        }
    }
]

# Create DSP filter chains and hide raw devices
node.software-dsp.rules = [
    # Speakers DSP
    {
        matches = [
            { node.name = "alsa_output.t2_raw_speakers" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/t2-linux-audio/16_4/graph.json"
                hide-parent = true
            }
        }
    }
    # Mic DSP
    {
        matches = [
            { node.name = "alsa_input.t2_raw_mic" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/t2-linux-audio/16_4/mic.json"
                hide-parent = true
            }
        }
    }
]

# Load the force-unmute Lua script to actively prevent muting
wireplumber.components = [
    {
        name = /usr/share/t2-linux-audio/16_4/t2-force-unmute.lua, type = script/lua,
        provides = custom.t2-audio
    }
]

# Enable required modules
wireplumber.profiles = {
    main = {
        node.software-dsp = required
        custom.t2-audio = required
    }
}
