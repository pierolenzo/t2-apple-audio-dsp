# WirePlumber configuration for T2 MacBook Air 9,1 DSP
# Uses node.software-dsp module like Asahi Linux to properly hide raw devices

monitor.alsa.rules = [
    # Speakers hardware node: rename and lower priority (hidden by DSP)
    {
        matches = [
            { api.alsa.card.name = "Apple T2 Audio", alsa.name = "Speaker" }
        ]
        actions = {
            update-props = {
                node.name = "alsa_output.t2_raw_speakers"
                node.description = "Raw Speaker Device (do not use)"
                node.nick = "RawSpeakers"
                priority.session = 100
            }
        }
    }
    # Mic hardware node: rename and lower priority (hidden by DSP)
    {
        matches = [
            { api.alsa.card.name = "Apple T2 Audio", alsa.name = "Digital Mic" }
        ]
        actions = {
            update-props = {
                node.name = "alsa_input.t2_raw_mic"
                node.description = "Raw Mic Device (do not use)"
                node.nick = "RawMic"
                priority.session = 100
            }
        }
    }
    # Headphones node: lower priority so the DSP sink (850) wins as default
    {
        matches = [
            { api.alsa.card.name = "Apple T2 Audio", alsa.name = "Codec Output" }
        ]
        actions = {
            update-props = {
                priority.session = 600
            }
        }
    }
]

# Create DSP filter chains and hide raw devices
node.software-dsp.rules = [
    # Speakers DSP
    {
        matches = [
            { api.alsa.card.name = "Apple T2 Audio", alsa.name = "Speaker" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/t2-linux-audio/9_1/graph.json"
                hide-parent = true
            }
        }
    }
    # Mic DSP
    {
        matches = [
            { api.alsa.card.name = "Apple T2 Audio", alsa.name = "Digital Mic" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/t2-linux-audio/9_1/mic.json"
                hide-parent = true
            }
        }
    }
]

# Enable required modules
wireplumber.profiles = {
    main = {
        node.software-dsp = required
    }
}
