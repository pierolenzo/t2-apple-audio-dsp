name: Auto Release Workflow

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'master-v*'

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq dpkg-dev
      - name: Validate JSON graphs
        run: |
          jq empty firs/*/*.json
      - name: Validate shell syntax
        run: |
          bash -n install.sh uninstall.sh debian/build.sh
          if compgen -G "scripts/*.sh" > /dev/null; then
            bash -n scripts/*.sh
          fi
          sh -n check-install.sh debian/postinst debian/postrm
      - name: Validate model assets
        run: |
          for model in 16_1 16_2 16_4 9_1; do
            test -f "config/${model}/51-t2-dsp.conf"
            test -f "firs/${model}/graph.json"
            test -f "firs/${model}/mic.json"
            compgen -G "firs/${model}/*.wav" > /dev/null
          done
      - name: Validate graph file references
        run: |
          missing=0
          while IFS= read -r path; do
            local_path="firs/${path#/usr/share/t2-linux-audio/}"
            if [ ! -e "$local_path" ]; then
              echo "Missing local asset for ${path}: ${local_path}" >&2
              missing=1
            fi
          done < <(grep -Rho '/usr/share/t2-linux-audio/[^", ]*' firs config | sort -u)
          exit "$missing"
      - name: Build Debian package
        run: |
          bash debian/build.sh

  auto_release_speakers:
    runs-on: ubuntu-latest
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    env:
        EXECUTE_ACTION: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          # master-v3.0.0 -> 3.0.0-1 (upstream + deb revision)
          VERSION=$(echo "$TAG" | sed 's/^master-v//')-1
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION (from tag $TAG)"
      - name: Update Version in debian/control
        run: |
          sed -i "s/^Version:.*/Version: ${{ steps.version.outputs.version }}/" debian/control
      - name: Generate Debian Package
        id: generate_deb
        run: |
          mkdir -p /tmp/output
          bash debian/build.sh
          echo "file=$(ls t2-apple-audio-dsp_*.deb)" >> $GITHUB_OUTPUT
      - name: "Release"
        uses: softprops/action-gh-release@v2
        if: env.EXECUTE_ACTION == 'true'
        with:
          files: |
            ${{ steps.generate_deb.outputs.file }}
            ${{ steps.generate_deb.outputs.file }}.sha256
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
